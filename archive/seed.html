        const ALLOWED_ADMINS = ['wj209ing@gmail.com'];

        // 監聽登入狀態
        auth.onAuthStateChanged(user => {
            if (user) {
                if (ALLOWED_ADMINS.includes(user.email)) {
                    showSeedArea(user);
                } else {
                    alert('您的帳號沒有管理員權限');
                    auth.signOut();
                }
            } else {
                showLoginArea();
            }
        });

        function showLoginArea() {
            document.getElementById('authArea').classList.remove('hidden');
            document.getElementById('seedArea').classList.add('hidden');
        }

        function showSeedArea(user) {
            document.getElementById('authArea').classList.add('hidden');
            document.getElementById('seedArea').classList.remove('hidden');
            document.getElementById('userName').innerText = user.displayName;
            document.getElementById('userEmail').innerText = user.email;
            document.getElementById('userAvatar').src = user.photoURL || 'https://www.gravatar.com/avatar/0?d=mp';
        }

        async function handleLogin() {
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                alert('登入失敗：' + error.message);
            }
        }

        async function handleLogout() {
            await auth.signOut();
        }

            const logEl = document.getElementById('log');
            logEl.style.display = 'block';
            logEl.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

                        const snapshot = await db.collection(coll).get();
