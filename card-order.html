<script src="js/api.js"></script>
<script>
    let linkConfig = null;
    let targetId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        targetId = urlParams.get('id');

        if (!targetId) {
            showError();
            return;
        }

        try {
            const snapshot = await db.collection('card_orders_links').where('suffix', '==', targetId).limit(1).get();
            if (snapshot.empty) {
                showError();
                return;
            }

            linkConfig = snapshot.docs[0].data();
            if (linkConfig.status !== '開啟') {
                showError();
                return;
            }

            renderPage();
        } catch (e) {
            console.error(e);
            alert("載入錯誤，請稍後再試");
        }
    });

    function showError() {
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('closed-mask').style.display = 'flex';
    }

    let selectedLogistics = null;

    function renderPage() {
        document.getElementById('loading-overlay').classList.add('hidden');
        const main = document.getElementById('main-content');
        main.classList.remove('hidden');
        setTimeout(() => main.classList.remove('opacity-0'), 50);

        document.getElementById('product-title').innerText = linkConfig.title;
        document.getElementById('display-items').innerText = linkConfig.items_text;

        // 圖片
        if (linkConfig.image_enabled && linkConfig.image_data) {
            const wrapper = document.getElementById('product-img-wrapper');
            const img = document.getElementById('product-img');
            img.src = linkConfig.image_data;
            wrapper.classList.remove('hidden');
        }

        // 運送方式 (卡片樣式)
        const shippingSection = document.getElementById('shipping-section');
        const shippingList = document.getElementById('shipping-options');
        const methods = linkConfig.shipping_methods || [];

        if (methods.length > 0) {
            shippingSection.classList.remove('hidden');
            shippingList.innerHTML = methods.map(m => {
                let fee = 0;
                if (!linkConfig.is_free_shipping) {
                    if (linkConfig.use_uniform_fee) {
                        fee = linkConfig.uniform_fee || 0;
                    } else {
                        if (m === '7-11') fee = linkConfig.fee_711 || 60;
                        else if (m === '全家') fee = linkConfig.fee_fami || 60;
                        else if (m === '宅配') fee = linkConfig.fee_home || 120;
                    }
                }

                const iconMap = {
                    '7-11': 'local_shipping',
                    '全家': 'local_shipping',
                    '宅配': 'home'
                };
                const icon = iconMap[m] || 'package';

                return `
                    <div class="logistics-card flex items-center justify-between p-4" id="card-${m}" onclick="selectLogistics('${m}')">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-rounded text-gray-400 text-2xl">${icon}</span>
                            <div class="flex flex-col">
                                <span class="text-sm font-bold text-gray-700">${m}</span>
                                <span class="text-[10px] text-gray-400">運費 NT$ ${fee}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                             ${(m === '7-11' || m === '全家') ? `
                                <a href="${m === '7-11' ? 'https://emap.pcsc.com.tw/' : 'https://www.family.com.tw/marketing/inquiry.aspx'}" 
                                   target="_blank" class="text-blue-500 hover:underline flex items-center gap-0.5" onclick="event.stopPropagation()">
                                    <span class="material-symbols-rounded" style="font-size: 16px;">map</span>
                                </a>
                            ` : ''}
                            <div class="w-5 h-5 rounded-full border-2 border-gray-200 flex items-center justify-center check-dot"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 付款方式
        const paymentSection = document.getElementById('payment-section');
        const paymentList = document.getElementById('payment-options');
        const paymentMethods = linkConfig.payment_methods || ['信用卡'];

        if (paymentMethods.length > 0) {
            paymentSection.classList.remove('hidden');
            paymentList.innerHTML = paymentMethods.map((pm, idx) => `
                <label class="flex items-center gap-3 p-4 rounded-xl bg-white border border-gray-100 cursor-pointer hover:bg-gray-50 transition-all select-none">
                    <input type="radio" name="payment_method" value="${pm}" ${idx === 0 ? 'checked' : ''} class="w-4 h-4 accent-[#6ea44c] border-gray-300">
                    <span class="text-sm font-bold text-gray-700">${pm}</span>
                </label>
            `).join('');
        }

        // 階段支付
        if (linkConfig.stages && linkConfig.stages.length > 0) {
            const section = document.getElementById('stages-section');
            const list = document.getElementById('stages-list');
            section.classList.remove('hidden');

            list.innerHTML = linkConfig.stages.map((s, idx) => `
                <label class="flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all border ${s.is_paid ? 'bg-gray-100 border-transparent opacity-60' : 'bg-white border-gray-100 hover:border-green-200'}">
                    <div class="flex items-center gap-3">
                        ${s.is_paid ?
                    `<span class="material-symbols-rounded text-gray-400">check_circle</span>` :
                    `<input type="radio" name="payment_stage" value="${idx}" onchange="updateTotal()" class="w-4 h-4 accent-[#6ea44c] border-gray-300">`
                }
                        <span class="text-sm font-bold ${s.is_paid ? 'text-gray-400 line-through' : 'text-gray-700'}">${s.label}</span>
                    </div>
                    <span class="text-sm font-mono font-bold ${s.is_paid ? 'text-gray-400' : 'text-[#6ea44c]'}">NT$ ${s.amount.toLocaleString()}</span>
                </label>
            `).join('');

            // 預選第一個未支付階段
            const radio = list.querySelector('input[name="payment_stage"]:not([disabled])');
            if (radio) radio.checked = true;
        }

        // 自動帶入儲存的使用者資訊
        const savedUser = localStorage.getItem('keicha_v2_user');
        if (savedUser) {
            const u = JSON.parse(savedUser);
            document.getElementById('input-phone').value = u.phone || '';
            document.getElementById('input-name').value = u.name || '';
            document.getElementById('input-email').value = u.email || '';
        }

        updateTotal();
    }

    function selectLogistics(method) {
        selectedLogistics = method;

        // 更新 UI 狀態
        document.querySelectorAll('.logistics-card').forEach(c => {
            c.classList.remove('active');
            c.querySelector('.check-dot').innerHTML = '';
            c.querySelector('.check-dot').style.borderColor = '#e5e7eb';
        });

        const card = document.getElementById('card-' + method);
        if (card) {
            card.classList.add('active');
            const dot = card.querySelector('.check-dot');
            dot.style.borderColor = '#6ea44c';
            dot.innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-[#6ea44c]"></div>';
        }

        const area = document.getElementById('shipping-address-area');
        const label = document.getElementById('shipping-label');
        const linkArea = document.getElementById('provider-link-area');

        area.classList.remove('hidden');
        label.innerText = (method === '7-11' || method === '全家') ? '收件店名/店號 *' : '收件地址 *';

        if (method === '7-11' || method === '全家') {
            linkArea.innerHTML = `
                <a href="${method === '7-11' ? 'https://emap.pcsc.com.tw/' : 'https://www.family.com.tw/marketing/inquiry.aspx'}" 
                   target="_blank" class="text-xs text-blue-500 font-bold hover:underline flex items-center gap-1">
                    <span class="material-symbols-rounded text-sm">map</span> 前往查詢店號
                </a>
            `;
        } else {
            linkArea.innerHTML = '';
        }

        updateTotal();
    }

    function updateTotal() {
        let base = linkConfig.amount || 0;

        // 如果有階段，且選取了某個階段
        const stageRadio = document.querySelector('input[name="payment_stage"]:checked');
        if (stageRadio) {
            base = linkConfig.stages[stageRadio.value].amount;
        }

        let shipping = 0;

        if (selectedLogistics) {
            if (linkConfig.is_free_shipping) {
                shipping = 0;
            } else if (linkConfig.use_uniform_fee) {
                shipping = linkConfig.uniform_fee || 0;
            } else {
                const m = selectedLogistics;
                if (m === '7-11') shipping = linkConfig.fee_711 || 60;
                else if (m === '全家') shipping = linkConfig.fee_fami || 60;
                else if (m === '宅配') shipping = linkConfig.fee_home || 120;
            }
        }

        const total = base + shipping;

        document.getElementById('display-amount').innerText = `NT$ ${total.toLocaleString()}`;
        document.getElementById('summary-total').innerText = `NT$ ${total.toLocaleString()}`;
    }

    async function lookupPhoneData(btn) {
        const phone = document.getElementById('input-phone').value.trim();
        if (!/^09\d{8}$/.test(phone)) return alert("請輸入 09 開頭 10 碼電話");

        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-rounded animate-spin-custom text-sm">refresh</span>';

        try {
            const snap = await db.collection('members').where('phone', '==', phone).limit(1).get();
            if (!snap.empty) {
                const u = snap.docs[0].data();
                document.getElementById('input-name').value = u.name || '';
                document.getElementById('input-email').value = u.email || '';
                // 儲存本地供下次使用
                localStorage.setItem('keicha_v2_user', JSON.stringify({
                    phone: phone,
                    name: u.name,
                    email: u.email
                }));
            } else {
                alert("查無會員資料，請手動填寫");
            }
        } catch (e) { console.error(e); }
        finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    async function submitOrder(btn) {
        const logistics = selectedLogistics;
        const address = document.getElementById('input-address').value.trim();

        const paymentRadio = document.querySelector('input[name="payment_method"]:checked');
        const payment_method = paymentRadio ? paymentRadio.value : '信用卡';

        const stageRadio = document.querySelector('input[name="payment_stage"]:checked');
        const stage_index = stageRadio ? parseInt(stageRadio.value) : -1;
        const stage_amount = stageRadio ? linkConfig.stages[stage_index].amount : linkConfig.amount;

        let shipping_fee = 0;
        if (logistics && logistics !== '不適用') {
            if (linkConfig.is_free_shipping) {
                shipping_fee = 0;
            } else if (linkConfig.use_uniform_fee) {
                shipping_fee = linkConfig.uniform_fee || 0;
            } else {
                if (logistics === '7-11') shipping_fee = linkConfig.fee_711 || 60;
                else if (logistics === '全家') shipping_fee = linkConfig.fee_fami || 60;
                else if (logistics === '宅配') shipping_fee = linkConfig.fee_home || 120;
            }
        }

        const payload = {
            name: document.getElementById('input-name').value.trim(),
            phone: document.getElementById('input-phone').value.trim(),
            email: document.getElementById('input-email').value.trim(),
            line_name: document.getElementById('input-line').value.trim(),
            note: document.getElementById('input-note').value.trim(),
            logistics: logistics,
            address: address,
            payment_method: payment_method,
            link_id: targetId,
            stage_index: stage_index,
            stage_amount: stage_amount,
            shipping_fee: shipping_fee,
            action: 'generate_card_payment'
        };

        if (!payload.name || !payload.phone || !payload.email || !payload.line_name) {
            alert("請填寫所有必傳欄位 (*)");
            return;
        }

        if (linkConfig.shipping_methods && linkConfig.shipping_methods.length > 0) {
            if (!logistics) return alert("請選擇運送方式");
            if (logistics !== '不適用' && !address) return alert("請填寫收件資訊");
        }

        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-rounded animate-spin-custom">refresh</span> 處理中...';

        try {
            const response = await fetch("https://script.google.com/macros/s/AKfycbxuhZcx8uKvrASAQy7ZEf3k979DT4b4qU6MK7Rhb8oiOir8QWCxlgmR4vYdticnxD0B/exec", {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.success) {
                if (result.payment_html) {
                    const div = document.createElement('div');
                    div.innerHTML = result.payment_html;
                    document.body.appendChild(div);
                    div.querySelector('form').submit();
                } else if (result.payment_url) {
                    window.location.href = result.payment_url;
                }
            } else {
                alert("建立訂單失敗：" + result.message);
            }
        } catch (e) {
            console.error(e);
            alert("系統錯誤：" + e.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }
</script>
