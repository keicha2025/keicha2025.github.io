<script>
    let currentMethod = null;
    let shippingRules = [];
    let globalMethods = [];

    document.addEventListener('DOMContentLoaded', async () => {
        // 1. 初始化 (從 Firestore 載入運費規則)
        try {
            const [shipSnap, methodsSnap] = await Promise.all([
                db.collection('shipping_rules').get(),
                db.collection('shipping_methods').get()
            ]);
            shippingRules = shipSnap.docs.map(doc => doc.data());
            globalMethods = methodsSnap.docs.map(doc => doc.data());
            renderLogistics(); // 動態生成配送
        } catch (e) { console.error("Rules Error:", e); }

        // 2. LocalStorage 自動填入
        const savedUser = localStorage.getItem('keicha_v2_user');
        if (savedUser) {
            const u = JSON.parse(savedUser);
            document.getElementById('input-phone').value = u.phone;
            fillFormWithData(u);
        }
    });

    function generateRandomSuffix(length = 4) {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let result = '';
        for (let i = 0; i < length; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    // --- 產生訂單編號 (Option 1) ---
    async function generateOrderId(prefixChar) {
        const now = new Date();
        const yy = String(now.getFullYear()).slice(-2);
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const datePrefix = `${prefixChar}${yy}${mm}${dd}`;

        const counterRef = db.collection('order_counters').doc(datePrefix);

        return await db.runTransaction(async (transaction) => {
            const counterDoc = await transaction.get(counterRef);
            let nextNum = 1;
            if (counterDoc.exists) {
                nextNum = (counterDoc.data().count || 0) + 1;
            }
            transaction.set(counterRef, { count: nextNum }, { merge: true });
            return `${datePrefix}${String(nextNum).padStart(2, '0')}`;
        });
    }

    // --- 按鈕狀態控制 (Loading & Lock) ---
    function setBtnLoading(btn, isLoading, text) {
        if (isLoading) {
            btn.dataset.originalText = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-rounded animate-spin-custom text-lg">refresh</span> ${text}`;
            btn.classList.add('btn-loading');
            btn.disabled = true;
        } else {
            btn.innerHTML = btn.dataset.originalText;
            btn.classList.remove('btn-loading');
            btn.disabled = false;
        }
    }

    // --- 核心功能 1: 電話查資料 (會員自動帶入) ---
    async function lookupPhoneData(btn) {
        const phone = document.getElementById('input-phone').value.trim();
        if (!/^09\d{8}$/.test(phone)) { KUI.alert('請輸入正確的 09 開頭 10 碼電話'); return; }

        document.getElementById('join-member-check').checked = true;
        setBtnLoading(btn, true, '查詢中...');

        try {
            const snapshot = await db.collection('members').where('phone', '==', phone).limit(1).get();
            if (!snapshot.empty) {
                fillFormWithData(snapshot.docs[0].data());
            }
            document.getElementById('input-items').focus();
        } catch (e) {
            KUI.alert('連線錯誤');
        } finally {
            setBtnLoading(btn, false);
        }
    }

    function fillFormWithData(u) {
        setVal('input-name', u.name);
        setVal('input-email', u.email);
        setVal('input-line', u.line_name || u.line_id);

        const container = document.getElementById('logistics-container');
        if (!container) return;

        container.querySelectorAll('.logistics-card').forEach(card => {
            const method = card.dataset.method;
            if (method.includes('7-11') && u.store_711) {
                const idEl = document.getElementById(`store-id-${method}`);
                const nameEl = document.getElementById(`store-note-${method}`);
                if (idEl) idEl.value = u.store_711;
                if (nameEl) nameEl.value = u.store_711_note || '';
            } else if (method.includes('全家') && u.store_fami) {
                const idEl = document.getElementById(`store-id-${method}`);
                const nameEl = document.getElementById(`store-note-${method}`);
                if (idEl) idEl.value = u.store_fami;
                if (nameEl) nameEl.value = u.store_fami_note || '';
            } else if ((method.includes('宅配') || method.includes('郵寄')) && u.shipping_address) {
                const addrEl = document.getElementById(`store-addr-${method}`);
                if (addrEl) addrEl.value = u.shipping_address;
            }
        });
        updatePageSummary();
    }

    // --- 核心功能 2: 更新頁面總計與運費預覽 ---
    function updatePageSummary() {
        const val = document.getElementById('input-amount').value;
        const subtotal = parseInt(val) || 0;
        let ship = 0;

        // 1. 更新所有卡片上的價格預覽
        const container = document.getElementById('logistics-container');
        if (container) {
            container.querySelectorAll('.logistics-card').forEach(card => {
                const method = card.dataset.method;
                const fee = calcShip(method, subtotal);
                const priceEl = card.querySelector('.logistics-price');
                if (priceEl) priceEl.innerText = `運費 $${fee}`;
            });
        }

        // 2. 準備底部資訊列文字
        let infoText = "總金額 (含運)";
        if (currentMethod) {
            ship = calcShip(currentMethod, subtotal);
            infoText = `總金額 (含運)｜${currentMethod} 運費 +${ship}`;
        } else {
            infoText = "總金額 (含運)｜尚未選擇物流";
        }

        const infoEl = document.getElementById('summary-info-text');
        if (infoEl) infoEl.innerText = infoText;

        const total = subtotal + ship;
        document.getElementById('summary-total').innerText = `NT$ ${total.toLocaleString()}`;
        saveDraft(); // 任何變更都存草稿
    }

    // --- UI 更新：動態生成物流卡片 ---
    function renderLogistics() {
        const container = document.getElementById('logistics-container');
        if (!container) return;

        // 過濾出屬於 diy.html 的規則
        const myRules = shippingRules.filter(r => {
            if (!r.category) return false;
            const cats = Array.isArray(r.category) ? r.category : [r.category];
            return cats.includes('diy.html') || cats.includes('自填單');
        });

        if (myRules.length === 0) {
            container.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm">暫無適用的配送方式</div>`;
            return;
        }

        const subtotal = parseInt(document.getElementById('input-amount').value) || 0;
        let html = '';

        myRules.forEach(rule => {
            const method = rule.method || '未命名物流';
            const fee = calcShip(method, subtotal);
            const is711 = method.includes('7-11');
            const isFami = method.includes('全家');
            const isHome = method.includes('宅配') || method.includes('郵寄');

            let icon = 'local_shipping';
            if (is711 || isFami) icon = 'store';
            if (isHome) icon = 'home';

            // 優先序：運費規則設定 > 全站物流管道設定 > 硬編碼預設值
            const gm = globalMethods.find(x => x.name === method);
            let queryLink = rule.tracking_link || (gm ? gm.query_url : '');

            if (!queryLink) {
                if (is711) queryLink = 'https://emap.pcsc.com.tw/';
                else if (isFami) queryLink = 'https://www.family.com.tw/marketing/inquiry.aspx';
            }

            let detailHtml = '';
            if (is711 || isFami) {
                detailHtml = `
                    <div class="flex gap-2">
                        <input type="text" id="store-id-${method}" class="diy-input flex-1" placeholder="輸入6碼店號" maxlength="6" inputmode="numeric" oninput="updatePageSummary()">
                        <a href="${queryLink}" target="_blank" class="btn-outline-green">查詢</a>
                    </div>
                    <input type="text" id="store-note-${method}" class="diy-input" placeholder="店名備註" oninput="updatePageSummary()">
                `;
            } else if (isHome) {
                detailHtml = `
                    <textarea id="store-addr-${method}" class="diy-input" rows="2" placeholder="請輸入完整收件地址" oninput="updatePageSummary()"></textarea>
                `;
            } else {
                detailHtml = `
                    <input type="text" id="store-note-${method}" class="diy-input" placeholder="備註資訊" oninput="updatePageSummary()">
                `;
            }

            html += `
                <div class="logistics-card flex flex-col gap-3 group" data-method="${method}" id="card-${method}" onclick="selectLogistics('${method}')">
                    <div class="flex items-center justify-between pointer-events-none">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-rounded text-gray-400 icon-active text-2xl">${icon}</span>
                            <span class="font-bold text-gray-700">${method}</span>
                        </div>
                        <div class="logistics-price text-xs font-bold text-gray-400">運費 $${fee}</div>
                    </div>
                    <div id="detail-${method}" class="hidden space-y-3 pt-3 border-t border-gray-100/50 mt-1" onclick="event.stopPropagation()">
                        ${detailHtml}
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
        if (currentMethod) selectLogistics(currentMethod);
        loadDraft();
    }

    function selectLogistics(method) {
        currentMethod = method;
        document.querySelectorAll('.logistics-card').forEach(el => {
            el.classList.remove('active');
            const det = el.querySelector('[id^="detail-"]');
            if (det) det.classList.add('hidden');
            const icon = el.querySelector('.material-symbols-rounded');
            if (icon) { icon.classList.remove('text-[#6ea44c]'); icon.classList.add('text-gray-400'); }
        });

        const target = document.getElementById(`card-${method}`);
        if (target) {
            target.classList.add('active');
            const targetDetail = document.getElementById(`detail-${method}`);
            if (targetDetail) targetDetail.classList.remove('hidden');
            const icon = target.querySelector('.material-symbols-rounded');
            if (icon) { icon.classList.add('text-[#6ea44c]'); icon.classList.remove('text-gray-400'); }
        }
        updatePageSummary();
    }

    function calcShip(method, amount) {
        if (!shippingRules || shippingRules.length === 0) return 0;
        const rule = shippingRules.find(r => {
            if (!r.method) return false;
            return r.method.includes(method) || method.includes(r.method);
        });
        if (!rule) return 0;

        let fee = Number(rule.base) || 0;
        if (rule.t3 && amount >= Number(rule.t3)) fee = Number(rule.f3) || 0;
        else if (rule.t2 && amount >= Number(rule.t2)) fee = Number(rule.f2) || 0;
        else if (rule.t1 && amount >= Number(rule.t1)) fee = Number(rule.f1) || 0;
        return fee;
    }

    // --- 核心功能 4: 送出訂單 ---
    async function submitOrder(btn) {
        const phone = getVal('input-phone');
        const items = getVal('input-items');
        const amount = parseInt(getVal('input-amount')) || 0;
        const name = getVal('input-name');
        const email = getVal('input-email');
        const line = getVal('input-line');
        const note = getVal('input-note');
        const isSave = document.getElementById('join-member-check').checked;

        if (!phone || !/^09\d{8}$/.test(phone)) return KUI.alert("請輸入正確的手機號碼");
        if (!items) return KUI.alert("請填寫商品內容");
        if (amount <= 0) return KUI.alert("請填寫金額");
        if (!name) return KUI.alert("請填寫姓名");
        if (!email) return KUI.alert("請填寫 Email");
        if (!line) return KUI.alert("請填寫 LINE 名稱");
        if (!currentMethod) return KUI.alert("請選擇物流方式");

        // 解析物流資料
        let storeId = "";
        let storeNote = "";
        const m = currentMethod;

        if (m.includes('7-11') || m.includes('全家')) {
            storeId = getVal(`store-id-${m}`);
            storeNote = getVal(`store-note-${m}`);
            if (!/^\d{6}$/.test(storeId)) return KUI.alert("請輸入正確的「6碼純數字」店號");
        } else if (m.includes('宅配') || m.includes('郵寄')) {
            storeId = "宅配到府";
            storeNote = getVal(`store-addr-${m}`);
            if (!storeNote) return KUI.alert("請填寫宅配收件地址");
        } else {
            storeId = "自定義物流";
            storeNote = getVal(`store-note-${m}`);
        }

        const ship = calcShip(m, amount);
        setBtnLoading(btn, true, "處理中...");

        const firestorePayload = {
            name, phone, email, line_name: line,
            store_id: storeId, store_note: storeNote,
            shipping_address: (m.includes('宅配') || m.includes('郵寄')) ? storeNote : null,
            items_text: items,
            items: [{ name: 'DIY自填項目', price: amount, qty: 1 }],
            subtotal: amount, shipping_fee: ship, total: amount + ship,
            note, logistics_type: m, payment_method: 'cod', status: '待處理',
            source_token: 'keicha_2025_web_auth',
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
            updated_at: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            const newOrderId = await generateOrderId('D');
            const trackingCode = `${newOrderId}-${generateRandomSuffix()}`;
            firestorePayload.tracking_code = trackingCode;

            await db.collection('orders').doc(newOrderId).set(firestorePayload);

            if (isSave) {
                const memberData = {
                    phone, name, email,
                    source_token: 'keicha_2025_web_auth',
                    updated_at: firebase.firestore.FieldValue.serverTimestamp()
                };
                if (m.includes('7-11')) { memberData.store_711 = storeId; memberData.store_711_note = storeNote; }
                else if (m.includes('全家')) { memberData.store_fami = storeId; memberData.store_fami_note = storeNote; }
                else if (m.includes('宅配') || m.includes('郵寄')) { memberData.shipping_address = storeNote; }

                const memberSnap = await db.collection('members').where('phone', '==', phone).limit(1).get();
                if (!memberSnap.empty) { await db.collection('members').doc(memberSnap.docs[0].id).update(memberData); }
                else { memberData.created_at = firebase.firestore.FieldValue.serverTimestamp(); await db.collection('members').add(memberData); }
            }

            if (window.API && window.API.sendNotification) {
                window.API.sendNotification('new_matcha_order', { ...firestorePayload, order_id: newOrderId }).catch(e => console.error(e));
            }

            localStorage.removeItem('diy_draft');
            KUI.alert("訂單已成功送出！");
            window.location.href = "fast-diy-result.html";
        } catch (e) {
            console.error(e);
            KUI.alert("送出失敗：" + e.message);
        } finally {
            setBtnLoading(btn, false);
        }
    }

    // --- 自動儲存功能 ---
    function saveDraft() {
        const draft = {
            phone: getVal('input-phone'),
            items: getVal('input-items'),
            amount: getVal('input-amount'),
            name: getVal('input-name'),
            email: getVal('input-email'),
            line: getVal('input-line'),
            note: getVal('input-note'),
            method: currentMethod
        };
        // 儲存動態輸入內容
        if (currentMethod) {
            const m = currentMethod;
            if (m.includes('7-11') || m.includes('全家')) {
                draft.storeId = getVal(`store-id-${m}`);
                draft.storeNote = getVal(`store-note-${m}`);
            } else if (m.includes('宅配') || m.includes('郵寄')) {
                draft.storeAddr = getVal(`store-addr-${m}`);
            } else {
                draft.storeNote = getVal(`store-note-${m}`);
            }
        }
        localStorage.setItem('diy_draft', JSON.stringify(draft));
    }

    function loadDraft() {
        const saved = localStorage.getItem('diy_draft');
        if (!saved) return;
        const draft = JSON.parse(saved);

        setVal('input-phone', draft.phone);
        setVal('input-items', draft.items);
        setVal('input-amount', draft.amount);
        setVal('input-name', draft.name);
        setVal('input-email', draft.email);
        setVal('input-line', draft.line);
        setVal('input-note', draft.note);

        if (draft.method) {
            currentMethod = draft.method;
            selectLogistics(draft.method);
            const m = draft.method;
            if (m.includes('7-11') || m.includes('全家')) {
                setVal(`store-id-${m}`, draft.storeId);
                setVal(`store-note-${m}`, draft.storeNote);
            } else if (m.includes('宅配') || m.includes('郵寄')) {
                setVal(`store-addr-${m}`, draft.storeAddr);
            } else {
                setVal(`store-note-${m}`, draft.storeNote);
            }
        }
        updatePageSummary();
    }

    // 監聽
    document.addEventListener('input', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            saveDraft();
        }
    });

    function getVal(id) { return document.getElementById(id)?.value.trim() || ''; }
    function setVal(id, v) { const el = document.getElementById(id); if (el) el.value = v || ''; }
    function setText(id, t) { const el = document.getElementById(id); if (el) el.innerText = t || ''; }
</script>
