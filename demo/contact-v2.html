<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡 KEICHA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --brand-green: #6ea44c;
            --font-brand: 'Zen Maru Gothic', sans-serif;
            --font-body: 'Noto Sans TC', sans-serif;
            --r-md: 16px;
            --r-lg: 24px;
            --r-full: 9999px;
        }

        body {
            font-family: var(--font-body), sans-serif;
            background-color: #fcfdfa;
            /* 輕微偏綠的暖白 */
            color: #334155;
        }

        .brand-title {
            font-family: var(--font-brand);
            font-weight: 700;
        }

        .brand-bg {
            background-color: var(--brand-green);
        }

        .brand-text {
            color: var(--brand-green);
        }

        .brand-border {
            border-color: var(--brand-green);
        }

        /* 自定義輸入框樣式 */
        .id-input {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .id-input:focus {
            border-color: var(--brand-green);
            background: #fdfdfd;
            outline: none;
            box-shadow: 0 0 0 4px rgba(110, 164, 76, 0.1);
        }

        /* 進場動畫 */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-up {
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* 點選縮放回饋 */
        @keyframes tapPop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.96);
            }

            100% {
                transform: scale(1);
            }
        }

        .tap-scale {
            animation: tapPop 0.3s ease-out;
        }

        /* QR Code 平滑展開 */
        .qr-transition {
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, margin 0.4s ease;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }

        .qr-transition.expanded {
            max-height: 300px;
            opacity: 1;
            margin-top: 1.5rem;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandGreen: '#6ea44c',
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        <!-- Main Card -->
        <div
            class="bg-white rounded-[var(--r-lg)] shadow-[0_20px_50px_rgba(0,0,0,0.08)] border border-gray-100 overflow-hidden animate-fade-up">

            <!-- Branding Header -->
            <div class="p-8 text-center border-b border-gray-50">
                <div
                    class="w-16 h-16 brand-bg rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-md shadow-brandGreen/20">
                    <span class="material-symbols-rounded text-white text-3xl">chat_bubble</span>
                </div>
                <h1 class="brand-title text-2xl brand-text mb-2 tracking-tight">聯絡官方客服</h1>
                <p class="text-gray-500 text-sm">透過 LINE 獲取您的服務進度與即時諮詢</p>
            </div>

            <!-- Interaction Area -->
            <div class="p-8 space-y-8">

                <!-- ID Selection -->
                <div class="space-y-3">
                    <label class="block text-center text-xs font-bold text-gray-400 uppercase tracking-widest">官方 LINE
                        ID</label>
                    <div class="relative">
                        <input type="text" value="@366qwylw" readonly
                            onfocus="this.select(); this.classList.add('tap-scale'); setTimeout(()=>this.classList.remove('tap-scale'), 300)"
                            class="id-input w-full py-4 text-2xl font-bold tracking-wider rounded-xl text-gray-700 transition-transform"
                            placeholder="LINE ID">
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none opacity-30">
                            <span class="material-symbols-rounded">content_copy</span>
                        </div>
                    </div>
                </div>

                <!-- Action Button -->
                <div class="pt-4">
                    <a href="https://lin.ee/F3JngaC" target="_blank" rel="noopener noreferrer"
                        class="flex items-center justify-center w-full brand-bg text-white px-8 py-4 rounded-xl text-lg font-bold hover:brightness-110 transition-all shadow-lg shadow-brandGreen/25 active:scale-95">
                        <span class="material-symbols-rounded mr-2">person_add</span>
                        加入好友
                    </a>
                </div>

                <!-- QR Display -->
                <div class="pt-2 border-t border-gray-50 text-center">
                    <button id="toggle-qr"
                        class="text-sm font-bold text-gray-400 hover:text-brandGreen transition-colors flex items-center justify-center mx-auto">
                        <span class="material-symbols-rounded mr-1 text-lg">qr_code_scanner</span>
                        或是掃描 QR Code
                    </button>

                    <div id="qr-box" class="qr-transition">
                        <div class="relative inline-block bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
                            <img src="https://qr-official.line.me/gs/M_366qwylw_BW.png?oat_content=qr"
                                alt="LINE QR Code" class="w-40 h-40">
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Back Link -->
        <div class="mt-8 text-center">
            <a href="/"
                class="text-gray-400 hover:text-brandGreen text-sm transition-colors flex items-center justify-center">
                <span class="material-symbols-rounded text-lg mr-1">arrow_back</span>
                返回首頁
            </a>
        </div>
    </div>

    <script>
        // QR Toggle
        const toggleBtn = document.getElementById('toggle-qr');
        const qrBox = document.getElementById('qr-box');

        toggleBtn.addEventListener('click', () => {
            const isExpanded = qrBox.classList.contains('expanded');
            if (!isExpanded) {
                qrBox.classList.add('expanded');
                toggleBtn.innerHTML = '<span class="material-symbols-rounded mr-1 text-lg">expand_less</span> 隱藏行動條碼';
                toggleBtn.classList.add('text-brandGreen');
            } else {
                qrBox.classList.remove('expanded');
                toggleBtn.innerHTML = '<span class="material-symbols-rounded mr-1 text-lg">qr_code_scanner</span> 或是掃描 QR Code';
                toggleBtn.classList.remove('text-brandGreen');
            }
        });
    </script>
</body>

</html>
