<style>
    /* Vertical Timeline Styles */
    .timeline-container {
        position: relative;
        padding-left: 2.5rem;
    }

    .timeline-container::before {
        content: '';
        position: absolute;
        left: 0.75rem;
        top: 0.5rem;
        bottom: 0.5rem;
        width: 2px;
        background-color: var(--border-std, #e5e7eb);
    }

    .timeline-item {
        position: relative;
        margin-bottom: 2rem;
    }

    .timeline-item:last-child {
        margin-bottom: 0;
    }

    .timeline-dot {
        position: absolute;
        left: -2.35rem;
        top: 0.25rem;
        width: 1.25rem;
        height: 1.25rem;
        background-color: #fff;
        border: 2px solid var(--border-std, #e5e7eb);
        border-radius: 50%;
        z-index: 10;
    }

    /* Status Colors */
    .timeline-item.status-gray .timeline-dot {
        background-color: #94a3b8;
        border-color: #94a3b8;
    }

    .timeline-item.status-green .timeline-dot {
        background-color: #6ea44c;
        border-color: #6ea44c;
        box-shadow: 0 0 0 4px #ebf1e9;
    }

    .timeline-content {
        opacity: 0.4;
    }

    .timeline-item.active .timeline-content {
        opacity: 1;
    }

    .loader {
        border: 3px solid #f3f4f6;
        border-top: 3px solid #6ea44c;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>

<div id="loading-state"
    class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="loader mb-4"></div>
    <p class="text-sm font-bold text-gray-400 brand-title-font tracking-widest">載入訂單資料中...</p>
</div>

<main class="py-12 px-6 md:px-12 min-h-screen">
    <div id="error-state" class="hidden max-w-2xl mx-auto text-center py-20">
        <span class="material-symbols-rounded text-6xl text-gray-300 mb-4">search_off</span>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">找不到訂單資訊</h1>
        <p class="text-gray-500 text-sm mb-8">請檢查您的連結是否正確，或聯繫客服協助。</p>
        <a href="jyoukyou.html" class="inline-flex items-center gap-2 text-[#6ea44c] font-bold hover:underline">
            <span class="material-symbols-rounded">arrow_back</span>
            返回查詢頁面
        </a>
    </div>

    <div id="main-content" class="hidden max-w-2xl mx-auto pb-12">
        <!-- Header -->
        <header class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-2xl font-bold brand-title-font text-gray-800">訂單詳情</h1>
                <p id="display-tracking-code" class="text-sm text-gray-500 font-mono mt-1"></p>
            </div>
        </header>

        <div class="grid grid-cols-1 gap-8">
            <!-- Section 1: Progress (Linear Vertical) -->
            <section class="bg-white p-8 rounded-[var(--r-lg)] border border-gray-100 shadow-sm">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-6 border-b pb-4">訂單進度軌跡</h2>
                <div class="timeline-container" id="timeline">
                    <!-- Dynamic Progress -->
                </div>
            </section>

            <!-- Section 2: Order Details -->
            <div class="bg-white rounded-[var(--r-lg)] border border-gray-100 shadow-sm overflow-hidden">
                <div class="p-8 pb-0">
                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">訂單明細</h2>
                </div>
                <div id="order-items" class="divide-y divide-gray-50">
                    <!-- Dynamic Items -->
                </div>
                <div class="bg-gray-50 p-8">
                    <div class="flex justify-between text-sm text-gray-500 mb-2">
                        <span>小計</span>
                        <span id="display-subtotal" class="font-mono">NT$ 0</span>
                    </div>
                    <div class="flex justify-between text-sm text-gray-500 mb-4">
                        <span id="display-shipping-type">運費</span>
                        <span id="display-shipping-fee" class="font-mono">NT$ 0</span>
                    </div>
                    <div class="flex justify-between items-center pt-4 border-t border-gray-200">
                        <span class="font-bold text-gray-800">應付總額</span>
                        <span id="display-total" class="text-2xl font-bold font-mono text-[#6ea44c]">NT$ 0</span>
                    </div>
                </div>
            </div>

            <!-- Section 3: Shipping Info -->
            <section class="bg-white p-8 rounded-[var(--r-lg)] border border-gray-100 shadow-sm">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-6">收件資訊</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase mb-1 block">收件人</label>
                        <p id="display-name" class="font-medium">-</p>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase mb-1 block">聯絡電話</label>
                        <p id="display-phone" class="font-medium font-mono">-</p>
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-[11px] font-bold text-gray-400 uppercase mb-1 block">收件資訊 / 商家資訊</label>
                        <p id="display-address" class="font-medium">-</p>
                    </div>
                    <div id="denwa-specific-info"
                        class="md:col-span-2 hidden grid grid-cols-2 gap-6 pt-4 border-t border-gray-50">
                        <div>
                            <label class="text-[11px] font-bold text-gray-400 uppercase mb-1 block">預約日期時段</label>
                            <p id="display-service-time" class="font-medium">-</p>
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-gray-400 uppercase mb-1 block">預約人數</label>
                            <p id="display-people-count" class="font-medium">-</p>
                        </div>
                    </div>
                    <div id="seller-reply-container" class="md:col-span-2 hidden">
                        <label class="text-[11px] font-bold text-gray-400 uppercase mb-1 block">賣家回覆</label>
                        <div
                            class="bg-[#f9fdf7] border border-[#ebf1e9] p-4 rounded-[var(--r-md)] text-sm text-[#5d8d41] leading-relaxed">
                            <p id="display-seller-reply"></p>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="mt-12 flex flex-col items-center gap-6">
            <button onclick="contactSupport()"
                class="w-full bg-[#6ea44c] text-white px-8 py-4 rounded-[var(--r-md)] font-bold shadow-md hover:bg-[#5d8d41] transition-all flex items-center justify-center gap-2 text-lg">
                <span class="material-symbols-rounded">chat_bubble</span>
                聯絡客服
            </button>
            <a href="jyoukyou.html"
                class="inline-flex items-center gap-2 text-gray-400 hover:text-[#6ea44c] transition-colors">
                <span class="material-symbols-rounded text-lg">arrow_back</span>
                <span class="text-sm font-bold">返回查詢頁面</span>
            </a>
        </footer>
    </div>
</main>

<!-- Firebase SDK (v9 compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
    // Firebase Configuration (Same as original)
    const firebaseConfig = {
        apiKey: "AIzaSyBF50fJPE-QL3yV4KaVIWzDmDPFRAkpwT4",
        authDomain: "keicha-membership-system.firebaseapp.com",
        projectId: "keicha-membership-system",
        storageBucket: "keicha-membership-system.firebasestorage.app",
        messagingSenderId: "941650156322",
        appId: "1:941650156322:web:5c7473aeaa184e0b94637b"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        if (!id) {
            showError();
            return;
        }

        try {
            // Cross-collection search using tracking_code
            const collections = ['orders', 'denwa_orders', 'card_orders'];
            let orderData = null;
            let orderType = '';

            for (const coll of collections) {
                const snap = await db.collection(coll).where('tracking_code', '==', id).limit(1).get();
                if (!snap.empty) {
                    orderData = snap.docs[0].data();
                    orderType = coll;
                    break;
                }
            }

            if (!orderData) {
                showError();
                return;
            }

            renderOrder(orderData, id, orderType);
            hideLoading();
        } catch (err) {
            console.error(err);
            showError();
        }
    });

    function renderOrder(data, trackingCode, type) {
        document.getElementById('display-tracking-code').innerText = `#${data.order_id || trackingCode}`;

        // 1. Progress Logic
        renderTimeline(data, type);

        // 2. Info Logic
        document.getElementById('display-name').innerText = data.name || data.customer_name || '未填寫';
        document.getElementById('display-phone').innerText = data.phone || '未填寫';

        let address = '';
        if (data.logistics_type || data.logistics) {
            const lType = data.logistics_type || data.logistics;
            const lVal = data.store_id || data.store || data.shipping_address || data.address || '-';
            const lNote = data.store_note ? ` (${data.store_note})` : '';
            address = `${lType} ${lVal}${lNote}`;
        } else if (data.merchant_name) {
            address = `日本商家：${data.merchant_name}`;
        } else {
            address = '現場服務 / 其它';
        }
        document.getElementById('display-address').innerText = address;

        // 3. Items Logic
        const itemsContainer = document.getElementById('order-items');
        itemsContainer.innerHTML = '';

        if (data.items && Array.isArray(data.items)) {
            data.items.forEach(item => {
                itemsContainer.innerHTML += `
                    <div class="p-8 flex gap-4">
                        <div class="w-16 h-16 bg-gray-50 rounded-[var(--r-md)] flex-shrink-0 flex items-center justify-center">
                            <span class="material-symbols-rounded text-gray-200">shopping_bag</span>
                        </div>
                        <div class="flex-1">
                            <h4 class="font-bold text-gray-800">${item.name}</h4>
                            ${item.spec ? `<p class="text-[10px] text-gray-400 mt-0.5">${item.spec}</p>` : ''}
                            <p class="text-sm text-gray-500">數量：${item.qty}</p>
                        </div>
                        <div class="text-right">
                            <span class="font-mono font-bold text-[#6ea44c]">NT$ ${(item.price * item.qty).toLocaleString()}</span>
                        </div>
                    </div>`;
            });
        } else if (data.items_text) {
            itemsContainer.innerHTML = `
                <div class="p-8">
                    <div class="bg-gray-50 rounded-[var(--r-md)] p-4 text-xs font-mono text-gray-500 leading-relaxed whitespace-pre-wrap">${data.items_text}</div>
                </div>`;
        } else if (data.plan_name) {
            itemsContainer.innerHTML = `
                <div class="p-8 flex gap-4">
                    <div class="w-16 h-16 bg-gray-50 rounded-[var(--r-md)] flex-shrink-0 flex items-center justify-center">
                        <span class="material-symbols-rounded text-gray-200">phone_callback</span>
                    </div>
                    <div class="flex-1">
                        <h4 class="font-bold text-gray-800">${data.plan_name}</h4>
                        <p class="text-sm text-gray-500">服務：電話代撥</p>
                        <p class="text-[10px] text-gray-400 mt-1">代撥商家：${data.merchant_name || '-'}</p>
                    </div>
                    <div class="text-right">
                        <span class="font-mono font-bold text-[#6ea44c]">NT$ ${(data.total || data.amount || 0).toLocaleString()}</span>
                    </div>
                </div>`;

            // 顯示電話專屬資訊
            document.getElementById('denwa-specific-info').classList.remove('hidden');
            document.getElementById('display-service-time').innerText = `${data.service_date || '-'} ${data.service_time || ''}`;
            document.getElementById('display-people-count').innerText = `${data.total_count || 0} 人 (${data.adult_count || 0}大 ${data.child_count || 0}小)`;
        }

        // 4. Budget Logic
        const subtotal = data.subtotal || data.base_amount || (data.total - (data.shipping_fee || 0)) || 0;
        const shipping = data.shipping_fee || data.shipping || 0;
        const total = data.total || data.amount || 0;

        document.getElementById('display-subtotal').innerText = `NT$ ${subtotal.toLocaleString()}`;
        document.getElementById('display-shipping-fee').innerText = `NT$ ${shipping.toLocaleString()}`;
        document.getElementById('display-total').innerText = `NT$ ${total.toLocaleString()}`;
        if (data.logistics_type || data.logistics) {
            document.getElementById('display-shipping-type').innerText = `運費 (${data.logistics_type || data.logistics})`;
        }

        // 5. Seller Reply
        const reply = data.public_reply || data.seller_note;
        if (reply) {
            document.getElementById('seller-reply-container').classList.remove('hidden');
            document.getElementById('display-seller-reply').innerText = reply;
        }
    }

    function renderTimeline(data, type) {
        const timeline = document.getElementById('timeline');
        const status = data.status || 'pending';

        let steps = [
            { id: 'sent', label: '已送出', desc: '您的需求已成功送出。', time: formatDate(data.created_at) },
            { id: 'confirmed', label: '已確認', desc: '系統已確認您的訂單資訊。', time: formatDate(data.updated_at || data.created_at) },
            { id: 'completed', label: '已完成', desc: '訂單已完成，感謝您的支持。', time: '' }
        ];

        let activeIdx = 0;
        if (['confirmed', '已確認', '處理中', '已出貨', '預約成功', '已付款'].includes(status)) activeIdx = 1;
        if (['completed', '已完成', '結案'].includes(status)) activeIdx = 2;

        timeline.innerHTML = steps.map((s, idx) => {
            let statusClass = '';
            let activeClass = '';
            if (idx === 0) statusClass = 'status-gray';
            if (idx > 0 && idx <= activeIdx) statusClass = 'status-green';
            if (idx <= activeIdx) activeClass = 'active';

            return `
                <div class="timeline-item ${statusClass} ${activeClass}">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <h3 class="font-bold ${idx <= activeIdx ? 'text-gray-800' : 'text-gray-400'}">${s.label}</h3>
                        <p class="text-sm ${idx === activeIdx ? 'text-[#6ea44c] font-medium' : 'text-gray-400'} mt-1">${s.desc}</p>
                        ${s.time ? `<span class="text-[11px] font-mono text-gray-300 block mt-2">${s.time}</span>` : ''}
                    </div>
                </div>`;
        }).join('');
    }

    function formatDate(ts) {
        if (!ts) return '';
        let d = ts.toDate ? ts.toDate() : new Date(ts);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleString('zh-TW', { hour12: false }).replace(/\//g, '-');
    }

    function showError() {
        document.getElementById('loading-state').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
        }, 300);
    }

    function hideLoading() {
        document.getElementById('loading-state').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        }, 300);
    }

    function contactSupport() {
        window.open('https://lin.ee/CffHu2o', '_blank');
    }
</script>
