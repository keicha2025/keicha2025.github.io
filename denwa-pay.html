<script>
    document.addEventListener('DOMContentLoaded', () => {
        const plansList = document.getElementById('plans-list');

        db.collection('denwa_plans')
            .get()
            .then(snapshot => {
                const plans = snapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .filter(p => p.status === 'ON' || p.status === 'available');

                if (plans.length === 0) {
                    plansList.innerHTML = '<p class="text-center text-gray-400 py-8 text-sm">目前尚無開放支付方案，請聯繫客服。</p>';
                    return;
                }

                // 金額由小到大排序
                plans.sort((a, b) => (Number(a.price) || 0) - (Number(b.price) || 0));

                renderPlans(plans);
            })
            .catch(err => {
                console.error("Fetch plans error:", err);
                plansList.innerHTML = `<p class="text-center text-red-400 py-8 text-sm">載入失敗: ${err.message}</p>`;
            });

        function renderPlans(plans) {
            plansList.innerHTML = '';
            plans.forEach(plan => {
                const html = `
                    <a href="${plan.link}" target="_blank" rel="noopener noreferrer" class="plan-item">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-lg font-bold text-gray-800">${plan.name}</span>
                            </div>
                            <p class="text-gray-400 text-xs leading-relaxed">${plan.desc || ''}</p>
                        </div>
                        <div class="text-right ml-4">
                            <div class="text-2xl font-bold text-brandGreen">$${plan.price}</div>
                        </div>
                    </a>
                `;
                plansList.insertAdjacentHTML('beforeend', html);
            });
        }
    });
</script>
